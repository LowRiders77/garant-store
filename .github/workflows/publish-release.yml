name: Garant Store - verified release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: garant-store-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verified-release:
    name: Build and publish Windows-verified release
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout exact tagged source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Refuse mismatched, development or unversioned tags
        shell: pwsh
        env:
          GS_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath VERSION.txt -Raw).Trim()
          if (-not ($version -match '^\d+\.\d+\.\d+(-[A-Za-z0-9.-]+)?$')) { throw 'Invalid VERSION.txt' }
          if ($version -match '(?i)(-dev|-rc)') { throw 'Development builds cannot be published.' }
          if ($env:GS_TAG -cne ('v' + $version)) { throw "Tag $env:GS_TAG must exactly match VERSION.txt v$version" }

      - name: Full Windows verified release builder
        shell: cmd
        run: powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "Build-VerifiedRelease.ps1" -OutputDirectory "${{ github.workspace }}\Releases"

      - name: Upload report and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.run_id }}
          path: |
            Releases/*.release-report.json
            Releases/*-release-gate.log
          if-no-files-found: warn
          retention-days: 30

      - name: Require verified artifact and publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          GS_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content -LiteralPath VERSION.txt -Raw).Trim()
          $zip = "Releases/GarantStore-v$version-VERIFIED.zip"
          $reportPath = "Releases/GarantStore-v$version-VERIFIED.release-report.json"
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) { throw 'VERIFIED ZIP missing; refusing publication.' }
          if (-not (Test-Path -LiteralPath $reportPath -PathType Leaf)) { throw 'Verification report missing; refusing publication.' }
          $report = Get-Content -LiteralPath $reportPath -Raw | ConvertFrom-Json
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($report.verified -ne $true -or $report.sha256 -ne $actual) { throw 'Release verification or SHA256 mismatch.' }
          if ($report.version -cne $version -or $env:GS_TAG -cne ('v' + $version)) { throw 'Release version mismatch.' }
          $checksum = "$actual  GarantStore-v$version-VERIFIED.zip"
          [IO.File]::WriteAllText("Releases/SHA256SUMS.txt",$checksum + "`n",(New-Object Text.UTF8Encoding($false)))
          gh release create $env:GS_TAG $zip $reportPath "Releases/SHA256SUMS.txt" --verify-tag --title "Garant Store v$version" --generate-notes
